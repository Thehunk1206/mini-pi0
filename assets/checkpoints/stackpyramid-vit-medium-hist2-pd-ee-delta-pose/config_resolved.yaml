experiment:
  name: maniskill3-stackpyramid-mp-transformer-vit-hist2-medium-pd-ee-delta-pose
  seed: 32
  runs_root: runs
simulator:
  backend: maniskill3
  task: StackPyramid-v1
  robot: panda_wristcam
  controller: pd_ee_delta_pose
  control_freq: 20
  horizon: 300
  reward_shaping: false
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_obs: true
  camera_names:
  - base_camera
  - hand_camera
  camera_width: 128
  camera_height: 128
  env_kwargs:
    obs_mode: rgbd
    render_mode: rgb_array
    control_mode: pd_ee_delta_pose
    reward_mode: sparse
task:
  object_name: pyramid
  object_pose_override: null
robot:
  name: panda_wristcam
  action_dim: 7
  proprio_keys:
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
  state_keys:
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
  image_key: agentview_image
  image_keys:
  - agentview_image
  - robot0_eye_in_hand_image
data:
  format: robomimic_hdf5
  robomimic_hdf5: data/robomimic/maniskill/stackpyramid/mp/rgbd_pd_ee_delta_pose.hdf5
  robomimic_data_group: data
  lerobot_repo_id: null
  lerobot_root: null
  lerobot_revision: null
  lerobot_episodes: null
  lerobot_action_key: action
  lerobot_state_key: observation.state
  lerobot_image_keys: null
  lerobot_episode_index_key: episode_index
  lerobot_local_files_only: false
  lerobot_video_backend: pyav
  fallback_image_hw:
  - 128
  - 128
  n_demos: 1000
  chunk_size: 16
  action_stats_path: action_stats.json
  filter_min_episode_length: 32
  filter_min_action_std: 0.0
  filter_min_state_delta: 0.0
  filter_state_delta_key: observation.state.object
  filter_drop_nan: true
dataset_collection:
  output_hdf5: artifacts/physical_scripted_oracle_mix_500_obj2to4_h700_640.hdf5
  total_episodes: 500
  num_envs: 1
  max_steps: 700
  only_success: true
  reject_long_episodes: true
  mix:
    core: 0.65
    recovery: 0.25
    suboptimal: 0.1
  difficulty: balanced
  force_perturbation_type: null
model:
  name: mini_pi0_fm
  action_dim: 7
  prop_dim: 9
  chunk_size: 16
  cond_dim: 256
  d_model: 512
  nhead: 8
  nlayers: 6
  action_backbone: transformer
  conditioning_mode: cross_attention
  action_attention_causal: false
  obs_horizon: 2
  vision_backbone: timm
  vision_model_name: vit_small_patch16_224
  vision_pretrained: true
  action_cnn_kernel_size: 5
  freeze_vision_backbone: false
  dropout: 0.1
  num_timestep_buckets: 1000
  noise_beta_alpha: 1.0
  noise_beta_beta: 1.0
  noise_s: 0.999
  state_dropout_prob: 0.0
  state_additive_noise_scale: 0.0
  add_action_pos_embed: true
  use_context_layernorm: true
  vision_token_grid_size: 4
  use_dit_adaln: true
train:
  epochs: 240
  batch_size: 256
  lr: 0.0001
  lr_scheduler: cosine
  scheduler_t_max: null
  scheduler_eta_min: 1.0e-06
  scheduler_step_size: 50
  scheduler_gamma: 0.5
  weight_decay: 0.0001
  num_workers: 32
  persistent_workers: true
  prefetch_factor: 4
  dataloader_in_order: true
  sample_order: auto
  block_shuffle_size: 2048
  block_shuffle_within_block: false
  save_best: true
  save_best_min_delta: 0.0001
  grad_clip_norm: 1.0
  model_print_depth: 2
  resume_from: runs/maniskill3-stackpyramid-mp-transformer-vit-hist2-medium-pd-ee-delta-pose/run2/checkpoints/best.pt
  resume_optimizer: true
  val_ratio: 0.0
  ema_decay: 0.99
  checkpoint_use_ema: true
  val_use_ema: false
  lr_backbone: 1.0e-05
  lr_expert: 0.0001
  image_aug_enable: false
  image_aug_crop_scale: 0.92
  image_aug_brightness: 0.15
  image_aug_contrast: 0.15
  image_aug_saturation: 0.12
  action_noise_std: 0.0
  action_noise_clip: 0.0
  action_smoothness_weight: 0.05
  action_jerk_weight: 0.01
  sim_eval_every_epochs: 40
  sim_eval_n_episodes: 100
  sim_eval_max_steps: 300
  sim_eval_record_grid: false
  save_best_success: true
  save_best_success_min_rate: 0.0
  dtype: bf16
  device: cuda
eval:
  run_dir: null
  checkpoint: checkpoints/best.pt
  weight_source: model
  action_stats_path: artifacts/action_stats.json
  n_episodes: 100
  execute_steps: 4
  n_flow_steps: 8
  flow_solver: euler
  chunk_overlap_blend: 0.0
  max_steps: 300
  verbose: true
  log_every_episodes: 1
  record: false
  record_grid: false
  grid_cameras:
  - base_camera
  - hand_camera
  grid_size: 5
  grid_fps: 20
  grid_width: 256
  grid_height: 256
  cube_xy: null
  cube_xy_range: null
  cube_z: null
  cube_yaw_deg: null
  plot_path: eval_metrics.png
  strict_parity: true
  action_smoothing_alpha: 0.0
  action_scale: null
  binary_gripper: true
  binary_gripper_index: 6
  binary_gripper_threshold: 0.0
  binary_gripper_low_value: -1.0
  binary_gripper_high_value: 1.0
  action_clip: true
  disable_domain_randomization: true
  vectorized: true
  num_envs: 32
  failure_reward_threshold: 0.2
  stability_warmup_steps: 0
  stability_warmup_execute_steps: null
  stability_warmup_n_flow_steps: null
  stability_warmup_action_smoothing_alpha: null
  dtype: bf16
  device: auto
deploy:
  mode: sim
  checkpoint: checkpoints/best.pt
  action_stats_path: artifacts/action_stats.json
  execute_steps: 2
  n_flow_steps: 6
  flow_solver: euler
  chunk_overlap_blend: 0.0
  max_steps: 300
  record_path: null
  strict_parity: true
  action_smoothing_alpha: 0.0
  action_scale: null
  binary_gripper: true
  binary_gripper_index: 6
  binary_gripper_threshold: 0.0
  binary_gripper_low_value: -1.0
  binary_gripper_high_value: 1.0
  action_clip: true
  stability_warmup_steps: 0
  stability_warmup_execute_steps: null
  stability_warmup_n_flow_steps: null
  stability_warmup_action_smoothing_alpha: null
  device: auto
