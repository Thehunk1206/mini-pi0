[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pi0"
version = "0.1.0"
description = "Modular flow-matching robot policy research stack"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "tqdm",
  "PyYAML",
  "h5py",
  "imageio",
  "imageio-ffmpeg",
  "matplotlib",
  "scipy",
]

[project.optional-dependencies]
lerobot = ["lerobot[dataset,viz]==0.6.1", "av"]
vision = ["timm"]
hardware = ["opencv-python-headless>=4.9.0,<4.14.0", "roboticstoolbox-python", "feetech-servo-sdk"]
maniskill3 = ["gymnasium", "mani_skill"]
isaaclab = []
dev = ["pytest"]

[project.scripts]
mini-pi0 = "mini_pi0.cli.main:main"

[tool.setuptools.packages.find]
include = ["mini_pi0*", "so101*"]

[tool.setuptools.package-data]
"so101.teleop" = ["kinematics/*.urdf"]
"so101.joint_ui" = ["static/*"]
"so101.phone_teleop" = [
  "dashboard/*",
  "dashboard/vendor/*",
  "dashboard/vendor/three/*",
  "dashboard/vendor/three/examples/jsm/controls/*",
  "dashboard/vendor/three/examples/jsm/loaders/*",
  "dashboard/vendor/urdf-loader/*",
]
