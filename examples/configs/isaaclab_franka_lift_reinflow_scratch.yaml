experiment:
  name: isaaclab-franka-lift-reinflow-scratch
  seed: 0
  runs_root: runs

simulator:
  backend: isaaclab
  task: franka_lift_cube
  robot: franka
  controller: joint_position
  control_freq: 60
  horizon: 300
  reward_shaping: true
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_obs: true
  camera_names: [front]
  camera_width: 128
  camera_height: 128
  env_kwargs:
    headless: true
    enable_cameras: true
    device: cuda:0

task:
  object_name: cube

robot:
  name: franka
  action_dim: 8
  image_key: agentview_image
  image_keys: [agentview_image]
  proprio_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, observation.state.object, observation.state.task_progress]
  state_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, observation.state.object, observation.state.task_progress]

model:
  name: mini_pi0_fm
  action_dim: 8
  prop_dim: 13
  chunk_size: 16
  cond_dim: 256
  d_model: 256
  nhead: 4
  nlayers: 4
  action_backbone: transformer
  conditioning_mode: cross_attention
  obs_horizon: 1
  vision_backbone: resnet18
  freeze_vision_backbone: true

rl:
  algorithm: reinflow_ppo
  init_mode: scratch
  action_normalization: env_bounds
  checkpoint: null
  action_stats_path: null
  use_reference_policy: false
  total_updates: 2
  rollout_decisions_per_update: 8
  num_envs: 4
  minibatch_size: 16
  epochs_per_update: 2
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.001
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 1.0
  actor_lr: 0.00003
  critic_lr: 0.0003
  target_kl: 0.01
  flow_steps: 4
  execution_horizon: 2
  noise_std_min: 0.05
  noise_std_init: 0.08
  noise_std_max: 0.12
  reference_w2_coef: 0.0
  reference_transition_kl_coef: 0.0
  velocity_anchor_coef: 0.0
  reward_strategy: native
  terminate_on_success: true
  freeze_vision_during_rl: true
  dtype: bf16
  rollout_storage_device: auto
  device: cuda
