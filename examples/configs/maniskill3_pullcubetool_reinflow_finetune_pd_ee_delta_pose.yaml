experiment:
  name: maniskill3-pullcubetool-reinflow-finetune-small-pd-ee-delta-pose-cuda-dr
  seed: 0
  runs_root: runs

simulator:
  backend: maniskill3
  task: MiniPi0PullCubeToolDR-v1
  robot: panda_wristcam
  controller: pd_ee_delta_pose
  control_freq: 20
  horizon: 450
  reward_shaping: true
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_obs: true
  camera_names: [base_camera, hand_camera]
  camera_width: 128
  camera_height: 128
  env_kwargs:
    obs_mode: rgbd
    render_mode: rgb_array
    control_mode: pd_ee_delta_pose
    reward_mode: dense
    # One native CUDA scene contains all RL environments.
    sim_backend: physx_cuda
    domain_randomization:
      enabled: true
      profile: strong
      robot_init_qpos_noise: 0.05
      pose:
        tool_x_range: [-0.34, -0.06]
        tool_y_range: [-0.34, -0.06]
        cube_x_range: [0.03, 0.28]
        cube_y_range: [-0.30, 0.10]
        cube_yaw_range_deg: [-45.0, 45.0]
      physics:
        cube_mass_scale_range: [0.70, 1.30]
        tool_mass_scale_range: [0.75, 1.25]
        friction_range: [0.50, 1.50]
        restitution_range: [0.0, 0.10]
      visual:
        color_jitter: 0.15

task:
  object_name: cube

robot:
  name: panda_wristcam
  action_dim: 7
  image_key: agentview_image
  image_keys: [agentview_image, robot0_eye_in_hand_image]
  proprio_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
  state_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]

model:
  name: mini_pi0_fm
  action_dim: 7
  prop_dim: 9
  chunk_size: 16
  cond_dim: 64
  d_model: 256
  nhead: 4
  nlayers: 4
  action_backbone: transformer
  conditioning_mode: cross_attention
  action_attention_causal: false
  obs_horizon: 2
  vision_backbone: timm
  vision_model_name: vit_small_patch16_224
  vision_pretrained: true
  vision_token_grid_size: 4
  freeze_vision_backbone: false
  dropout: 0.1
  noise_beta_alpha: 1.0
  noise_beta_beta: 1.0
  noise_s: 0.999
  add_action_pos_embed: true
  use_context_layernorm: true
  use_dit_adaln: true

rl:
  algorithm: reinflow_ppo
  init_mode: checkpoint
  action_normalization: dataset_stats
  checkpoint: runs/maniskill3-pullcubetool-mp-transformer-vit-hist2-small-pd-ee-delta-pose/run1/checkpoints/best.pt
  action_stats_path: runs/maniskill3-pullcubetool-mp-transformer-vit-hist2-small-pd-ee-delta-pose/run1/artifacts/action_stats.json
  resume_from: null
  use_reference_policy: true
  total_updates: 200
  rollout_decisions_per_update: 128
  num_envs: 16
  minibatch_size: 256
  epochs_per_update: 2
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.003
  entropy_coef: 0.0
  entropy_per_symbol: true
  value_coef: 0.5
  max_grad_norm: 1.0
  actor_lr: 0.000001
  critic_lr: 0.0003
  actor_weight_decay: 0.0
  critic_weight_decay: 0.0
  lr_scheduler: constant
  actor_lr_warmup_updates: 10
  target_kl: 0.001
  flow_steps: 6
  flow_solver: euler
  execution_horizon: 2
  binary_gripper: true
  binary_gripper_index: 6
  binary_gripper_threshold: 0.0
  binary_gripper_low_value: -1.0
  binary_gripper_high_value: 1.0
  noise_mode: learned_diagonal
  noise_std_min: 0.02
  noise_std_init: 0.04
  noise_std_max: 0.06
  noise_std_final_max: 0.04
  noise_schedule_hold_fraction: 0.5
  clip_denoised_actions: false
  reference_w2_coef: 0.001
  reference_transition_kl_coef: 0.0
  velocity_anchor_coef: 0.0
  critic_warmup_updates: 5
  critic_warmup_epochs: 1
  critic_output_bias_init: 0.0
  terminate_on_success: true
  eval_every_updates: 10
  eval_episodes: 50
  eval_seed_start: 2000
  # Select checkpoints on the target CUDA backend without training randomization.
  eval_num_envs: 16
  eval_sim_backend: physx_cuda
  eval_disable_domain_randomization: true
  reward_strategy: native
  freeze_vision_during_rl: true
  dtype: bf16
  rollout_storage_device: auto
  device: cuda
