# Surrogate ablation only. This is not ReinFlow path-space optimization.
experiment:
  name: isaaclab-franka-lift-gaussian-ppo-baseline
  seed: 0
  runs_root: runs

simulator:
  backend: isaaclab
  task: franka_lift_cube
  robot: franka
  controller: joint_position
  control_freq: 60
  horizon: 300
  reward_shaping: true
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_obs: true
  camera_names: [front]
  camera_width: 128
  camera_height: 128
  env_kwargs:
    headless: true
    enable_cameras: true

task:
  object_name: cube

robot:
  name: franka
  action_dim: 8
  image_key: agentview_image
  image_keys: [agentview_image]
  proprio_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, observation.state.object, observation.state.task_progress]
  state_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, observation.state.object, observation.state.task_progress]

model:
  name: mini_pi0_fm
  action_dim: 8
  prop_dim: 13
  chunk_size: 16
  cond_dim: 256
  d_model: 256
  nhead: 4
  nlayers: 4

rl:
  algorithm: gaussian_ppo_baseline
  init_mode: checkpoint
  action_normalization: dataset_stats
  use_reference_policy: true
  checkpoint: runs/isaaclab-franka-lift-bc/run1/checkpoints/best.pt
  action_stats_path: runs/isaaclab-franka-lift-bc/run1/artifacts/action_stats.json
  total_updates: 10
  rollout_steps: 128
  num_envs: 1
  minibatch_size: 64
  epochs_per_update: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  kl_coef: 0.05
  max_grad_norm: 1.0
  lr: 0.00003
  log_std_init: -1.0
  target_kl: 0.03
  device: cuda
